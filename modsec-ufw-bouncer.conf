# /etc/modsec-ufw-bouncer.conf

[general]
# Space- or comma-separated log files.
# Apache audit/error example:
#   /var/log/apache2/modsec_audit.log /var/log/apache2/error.log
# Nginx audit/error example:
#   /var/log/nginx/modsec_audit.log /var/log/nginx/error.log
log_paths = /var/log/apache2/modsec_audit.log /var/log/apache2/error.log

state_file = /var/lib/modsec-ufw-bouncer/state.json

# How often new log bytes are checked.
poll_interval = 5

# Policy for any ModSecurity rule ID that does not have a specific section.
# threshold = failures from one source IP
# window = seconds in the sliding window
# block_duration = seconds to keep the UFW deny; 0 means permanent
default_threshold = 5
default_window = 300
default_block_duration = 3600

# Optional restriction to selected ModSecurity rule IDs. Leave blank to monitor
# every rule ID found in the logs. Example:
#   enabled_rule_ids = 920280,932100,949110
enabled_rule_ids =

# These IPs/CIDRs are never counted or blocked.
# Use only trusted addresses; 0.0.0.0/0 whitelists the world (and is a bad idea).
whitelist = 127.0.0.1 ::1

ufw_binary = /usr/sbin/ufw
ufw_timeout = 10

# Rule-specific policies. Each [rule:ID] section also enables that rule ID.
# Example: block a source IP after 3 hits in 5 minutes for 10 minutes.
[rule:920280]
threshold = 3
window = 300
block_duration = 600

# Example: block immediately for 24 hours after one instance.
[rule:932100]
threshold = 1
window = 60
block_duration = 86400
